<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>Universal Media Pro Saver | Tải X & YouTube MP4 / MP3</title>
    <meta name="description" content="Tải ảnh gốc :orig, video 4K từ X (Twitter) và tải Video HD / Chuyển đổi MP3 320kbps từ YouTube cực nhanh và sắc nét.">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <!-- Ambient Background Glows -->
    <div class="ambient-glow glow-1"></div>
    <div class="ambient-glow glow-2"></div>
    <div class="ambient-glow glow-3"></div>

    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <div class="brand">
                <div class="brand-logo">
                    <i class="fa-solid fa-cloud-arrow-down"></i>
                </div>
                <div class="brand-info">
                    <h1>Media <span class="gradient-text">Pro Saver</span></h1>
                    <p class="subtitle">Tải <strong>X (Twitter)</strong> & <strong>YouTube (MP4 / MP3 320k)</strong> chất lượng cao</p>
                </div>
            </div>
            
            <div class="header-actions">
                <button id="btn-open-folder" class="btn btn-secondary" title="Mở thư mục lưu trên máy tính">
                    <i class="fa-solid fa-folder-open"></i>
                    <span>Thư mục lưu</span>
                </button>
                <button id="btn-toggle-history" class="btn btn-secondary" title="Lịch sử tải xuống">
                    <i class="fa-solid fa-clock-rotate-left"></i>
                    <span>Lịch sử</span>
                </button>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Search & Input Card -->
            <section class="input-card glass-panel">
                <!-- Platform Tabs -->
                <div class="platform-tabs">
                    <button class="tab-btn active" data-platform="all">
                        <i class="fa-solid fa-wand-magic-sparkles"></i>
                        <span>Tự động nhận diện</span>
                    </button>
                    <button class="tab-btn" data-platform="twitter">
                        <i class="fa-brands fa-x-twitter"></i>
                        <span>X (Twitter)</span>
                    </button>
                    <button class="tab-btn" data-platform="youtube">
                        <i class="fa-brands fa-youtube"></i>
                        <span>YouTube & MP3</span>
                    </button>
                </div>

                <form id="extract-form" class="search-form">
                    <div class="input-wrapper">
                        <i class="fa-solid fa-link input-icon"></i>
                        <input 
                            type="text" 
                            id="tweet-url-input" 
                            placeholder="Dán link X (Twitter) hoặc YouTube / Shorts vào đây..." 
                            autocomplete="off"
                            spellcheck="false"
                            required
                        >
                        <button type="button" id="btn-paste" class="action-chip" title="Dán từ Clipboard">
                            <i class="fa-regular fa-clipboard"></i>
                            <span>Dán</span>
                        </button>
                        <button type="button" id="btn-clear" class="action-chip btn-clear hidden" title="Xóa">
                            <i class="fa-solid fa-xmark"></i>
                        </button>
                    </div>

                    <button type="submit" id="btn-submit" class="btn btn-primary btn-glow">
                        <span class="btn-text">
                            <i class="fa-solid fa-bolt"></i>
                            <span>Phân Tích</span>
                        </span>
                        <span class="btn-loader hidden">
                            <i class="fa-solid fa-circle-notch fa-spin"></i>
                            <span>Đang trích xuất...</span>
                        </span>
                    </button>
                </form>

                <div class="quick-hints">
                    <span class="hint-item"><i class="fa-solid fa-check"></i> Ảnh X gốc <strong>:orig</strong></span>
                    <span class="hint-item"><i class="fa-solid fa-check"></i> Video 4K/1080p MP4</span>
                    <span class="hint-item"><i class="fa-solid fa-music"></i> Chuyển đổi <strong>MP3 320kbps</strong> cực chuẩn</span>
                </div>
            </section>

            <!-- Loading State Skeleton -->
            <div id="skeleton-loading" class="skeleton-container hidden">
                <div class="skeleton-card glass-panel">
                    <div class="skeleton-header">
                        <div class="skeleton-avatar"></div>
                        <div class="skeleton-lines">
                            <div class="skeleton-line w-40"></div>
                            <div class="skeleton-line w-25"></div>
                        </div>
                    </div>
                    <div class="skeleton-line w-90"></div>
                    <div class="skeleton-line w-75"></div>
                    <div class="skeleton-media"></div>
                </div>
            </div>

            <!-- Result Card Container -->
            <div id="result-container" class="result-container hidden">
                <!-- Injected via JavaScript -->
            </div>
        </main>

        <!-- History Modal Drawer -->
        <div id="history-modal" class="modal-backdrop hidden">
            <div class="modal-card glass-panel">
                <div class="modal-header">
                    <div class="modal-title">
                        <i class="fa-solid fa-clock-rotate-left"></i>
                        <h3>Lịch sử tải gần đây</h3>
                    </div>
                    <div class="modal-controls">
                        <button id="btn-clear-history" class="btn btn-sm btn-danger" title="Xóa toàn bộ lịch sử">
                            <i class="fa-solid fa-trash-can"></i> Xóa
                        </button>
                        <button id="btn-close-history" class="btn-close" title="Đóng">
                            <i class="fa-solid fa-xmark"></i>
                        </button>
                    </div>
                </div>
                <div class="modal-body" id="history-list">
                    <!-- History items rendered here -->
                </div>
            </div>
        </div>

        <!-- Lightbox / Image Preview Modal -->
        <div id="lightbox-modal" class="lightbox-backdrop hidden">
            <button id="lightbox-close" class="lightbox-close" title="Đóng xem trước">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <div class="lightbox-content">
                <img id="lightbox-img" src="" alt="Xem trước ảnh gốc">
                <div class="lightbox-actions">
                    <a id="lightbox-download-btn" href="#" class="btn btn-primary" download target="_blank">
                        <i class="fa-solid fa-download"></i> Tải ảnh gốc này
                    </a>
                </div>
            </div>
        </div>

        <!-- Toast Notifications -->
        <div id="toast-container" class="toast-container"></div>
    </div>

    <!-- Main Javascript -->
    <script src="/static/js/main.js"></script>
</body>
</html>
